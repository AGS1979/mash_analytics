<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mash AI</title>
  <link rel="stylesheet" href="static/css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <div class="logo">
      <img src="static/images/Picture1.png" alt="Company Logo" />
    </div>
    <div class="logout">
      <a href="{{ url_for('logout') }}">Logout</a>
    </div>
  </header>

  <main>
    <div class="chat-container">
        <div class="chat-history">
          <!-- top section: existing chat history -->
          <div class="chat-history-top">
            <button id="new-query-btn">New Query</button>
            <h3 id="prev-chat-title">Prev Chat:</h3>
            <ul id="chat-history-list"></ul>
          </div>

          <!-- bottom section: static info -->
          <div class="chat-history-bottom">
            <h4>Mash – Your Virtual Investment Analyst</h4>
            <ol>
              <li>Search for news on any topic</li>
              <li>Generate stock reports</li>
              <li>Get earnings calls summarized</li>
              <li>Get insights from sustainability reports</li>
              <li>…</li>
              <li>…</li>
            </ol>
          </div>
        </div>

      <div class="chat-main">
        <div id="chat-box"></div>
      </div>
    </div>


    <!-- Chat Input Area with Integrated File Attachment -->
    <div class="text-input">
      <button id="attach-btn" title="Attach a PDF file">+</button>
      <input type="file" id="file-input" accept="application/pdf, text/html" multiple style="display: none;" />
      <span id="file-info"></span>
      <select id="summary-type" style="display: none;">
    <option value="short">Short Summary</option>
    <option value="long">Long Summary</option>
    <option value="esg">ESG Sustainability Report</option>
    <option value="esg_compare">ESG Comparison</option>  <!-- Added ESG Comparison Option -->
</select>
      <textarea id="chat-input" placeholder="Enter text here..."></textarea>
      <button id="send-btn">Send</button>
    </div>
  </main>


<script>
  // currentUser is now available in your JavaScript
  var currentUser = "{{ session['username'] }}";
</script>


  <script src="static/js/scripts.js"></script>
</body>
</html>
