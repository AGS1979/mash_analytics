<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Agents</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            color: #e5e5e5;
            font-size: 18px;
            margin: 0;
            padding: 0;
            background:
              linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)),
              url("{{ url_for('static', filename='images/AI.png') }}") no-repeat center center / cover;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 9999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(246, 242, 239);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        header .logo img {
            max-height: 85px;
            width: auto;
        }

        header .banner {
            flex: 2;
            text-align: center;
            font-weight: bold;
            font-size: 22px;
            color: #1f2937;
        }

        header .logout a {
            text-decoration: none;
            color: #307aff;
            font-weight: bold;
        }

        main {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 120px;
        }

        .landing-panel {
            text-align: center;
            padding: 40px 20px;
            color: white;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 12px;
            max-width: 600px;
            margin: 40px auto;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
            width: 95%;
            max-width: 1200px;
            margin: 0 auto 60px;
        }

        .agent-card {
            background-color: rgba(31, 41, 55, 0.95);
            border: 1px solid #3b82f6;
            border-radius: 12px;
            padding: 20px;
            color: #e5e5e5;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease-in-out;
        }

        .agent-card:hover {
            transform: translateY(-5px);
            border-color: #60a5fa;
        }

        .agent-card h2 {
            font-size: 20px;
            color: #93c5fd;
            margin-bottom: 10px;
        }

        .agent-card p {
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .agent-output pre {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            color: #d1d5db;
            white-space: pre-wrap;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                text-align: center;
            }

            header .logo img {
                max-height: 60px;
            }

            main {
                margin-top: 140px;
            }

            .agent-grid {
                grid-template-columns: 1fr;
            }

            .landing-panel {
                margin: 20px 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">
            <img src="{{ url_for('static', filename='images/Picture1.png') }}" alt="MaSh Analytics">
        </div>
        <div class="banner">Custom Research Agents</div>
        <div class="logout">
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </header>

    <main>
        <section class="landing-panel">
            <h1>Explore Our Research Agents</h1>
            <p>Discover AI-powered tools tailored for financial research, strategy, and analysis.</p>
        </section>

        <section class="agent-grid">
            {% for agent in agents %}
                <div class="agent-card">
                    <h2>{{ agent.name }}</h2>
                    <p><strong>Category:</strong> {{ agent.category }}</p>
                    <p>{{ agent.description }}</p>
                    <div class="agent-output">
                        <strong>Example Output:</strong>
                        <pre>{{ agent.output }}</pre>
                    </div>
                </div>
            {% endfor %}
        </section>
    </main>
</body>
</html>
