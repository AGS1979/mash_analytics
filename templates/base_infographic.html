<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ company_name }} – Pre-IPO Infographic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f9fafb;
      color: #1f2937;
    }
    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #00416A;
      margin-top: 2rem;
      border-bottom: 2px solid #cbd5e1;
      padding-bottom: 0.25rem;
    }
    .section-content {
      margin-top: 0.75rem;
      line-height: 1.6;
    }
  </style>
</head>
<body class="p-6 max-w-4xl mx-auto">
  <h1 class="text-3xl font-bold text-center text-blue-800 mb-8">{{ company_name }} – Pre-IPO Investment Memo Infographic</h1>

  {% for heading, content in sections.items() %}
    <div class="section">
      <h2 class="section-title">{{ heading }}</h2>
      <p class="section-content">{{ content }}</p>
    </div>
  {% endfor %}

  <footer class="mt-12 text-center text-gray-500 text-sm">
    Generated by Aranca GenAI Platform
  </footer>
</body>
</html>
